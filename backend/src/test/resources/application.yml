spring:
  datasource:
    url: jdbc:h2:mem:codefortress;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: test-secret-that-is-longer-than-thirty-two-characters
    issuer: https://api.codefortress.local
    access-token-ttl: 15m
    refresh-token-ttl: P30D