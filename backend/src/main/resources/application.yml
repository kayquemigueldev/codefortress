spring:
  application:
    name: codefortress-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:codefortress}}
    username: ${DB_USERNAME:${POSTGRES_USER:codefortress}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:https://api.codefortress.local}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

    refresh-cookie:
      name: codefortress_refresh
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: Strict
      path: /api/v1/auth