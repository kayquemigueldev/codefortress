spring:
  application:
    name: codefortress-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:codefortress}}
    username: ${DB_USERNAME:${POSTGRES_USER:codefortress}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
